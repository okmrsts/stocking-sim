<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ストッキング・シミュレーター</title>
  <link rel="stylesheet" href="./src/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main>
    <header class="header">
      <div>
        <h1>ストッキング・シミュレーター</h1>
        <p>20D 平編みニーハイ</p>
      </div>
      <a class="probe-link" href="./checks/0/probe.html">WebGPU診断</a>
    </header>
    <section class="viewer" aria-label="ニーハイの着用状態">
      <div class="stage" id="stage">
        <canvas aria-label="20D 平編みニーハイの3D表示"></canvas>
        <div class="view-label" id="view-label">全体</div>
        <div class="scale" id="scale" hidden><span></span>1 mm</div>
        <p id="status" role="status" data-state="loading">WebGPU を初期化しています…</p>
        <pre id="details" hidden></pre>
        <div id="legend" hidden><div class="legend-fill"></div><div id="legend-text"></div></div>
      </div>
      <nav class="toolbar" aria-label="視点">
        <button type="button" data-view="front" aria-pressed="true">全体</button>
        <button type="button" data-view="oblique" aria-pressed="false">斜め</button>
        <button type="button" data-view="ankle-wrinkles" aria-pressed="false">シワ</button>
        <button type="button" data-view="thigh" aria-pressed="false">太もも</button>
        <button type="button" data-view="thigh-macro" aria-pressed="false">極限マクロ</button>
        <button type="button" id="settings-open">確かめる</button>
      </nav>
      <div class="subviews" id="subviews" aria-label="観察箇所" hidden></div>
    </section>
    <div class="footer" aria-label="計測情報">
      <span id="mesh-stats">布メッシュを準備中</span>
      <span id="solve-stats"></span>
      <span id="frame-stats"></span>
    </div>

    <dialog id="settings" aria-labelledby="settings-title">
      <form method="dialog" class="sheet-heading">
        <h2 id="settings-title">確かめ用の表示</h2><button type="submit">閉じる</button>
      </form>
      <label for="display-mode">表示する項目</label>
      <select id="display-mode">
        <option value="0">着用状態</option><option value="1">張力</option>
        <option value="2">周方向の伸び</option><option value="3">肌との隙間</option>
        <option value="4">不透明度</option><option value="5">濡れ（0%）</option>
        <option value="6">接触圧</option>
      </select>
      <button type="button" id="benchmark">解像度別の布計算を測る</button>
      <p class="measurement" id="benchmark-result" aria-live="polite"></p>
    </dialog>
  </main>
  <script type="module">
    import('./src/main.js').then(({ start }) => start()).catch(error => {
      const status = document.querySelector('#status');
      status.dataset.state = 'error';
      status.textContent = '初期化できませんでした';
      const details = document.querySelector('#details');
      details.textContent = error.message;
      details.hidden = false;
    });
  </script>
</body>
</html>
